<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos - Predicted vs Ground Truth</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b1120; color: #f1f5f9; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #1e293b; }
        h1 { font-size: 20px; }
        .controls { background: #1e293b; padding: 16px 20px; border-radius: 10px; display: flex; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
        .group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
        select, input { background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 10px 12px; border-radius: 6px; font-size: 14px; outline: none; }
        button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; height: 40px; }
        button:hover { background: #4338ca; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .card { background: #1e293b; padding: 16px; border-radius: 10px; position: relative; }
        #chart { width: 100%; height: 560px; }
        .stats { display: flex; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #334155; }
        .stat { background: #0f172a; padding: 10px 16px; border-radius: 6px; flex: 1; }
        .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
        .stat-val { font-size: 18px; font-weight: 700; margin-top: 2px; }
        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(11,17,32,0.85); display: none; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; border-radius: 10px; z-index: 10; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Kronos: Predicted vs Ground Truth</h1>
            <div style="font-size: 13px; color: #94a3b8;">
                <span style="color:#2563eb; font-weight:bold;">━ Blue: Ground Truth</span> &nbsp;|&nbsp; 
                <span style="color:#ef4444; font-weight:bold;">━ Red: Kronos Prediction</span>
            </div>
        </header>

        <div class="controls">
            <div class="group" style="flex: 2;">
                <label>Select Asset (Crypto / Indian Stock)</label>
                <select id="datasetSelect">
                    <option value="CRYPTO_BTC_USD_5m.csv" selected>₿ Bitcoin (BTC/USD 5m)</option>
                    <option value="CRYPTO_BTC_USD_1h.csv">₿ Bitcoin (BTC/USD 1h)</option>
                    <option value="CRYPTO_ETH_USD_5m.csv">Ξ Ethereum (ETH/USD 5m)</option>
                    <option value="CRYPTO_SOL_USD_5m.csv">◎ Solana (SOL/USD 5m)</option>
                    <option value="NSE_NIFTY50_5m.csv">🇮🇳 NSE NIFTY 50 (5m Intraday)</option>
                    <option value="NSE_BANKNIFTY_5m.csv">🇮🇳 NSE BANK NIFTY (5m Intraday)</option>
                    <option value="NSE_RELIANCE_5m.csv">🇮🇳 Reliance Industries (5m)</option>
                    <option value="NSE_TCS_5m.csv">🇮🇳 TCS (5m)</option>
                    <option value="NSE_HDFCBANK_5m.csv">🇮🇳 HDFC Bank (5m)</option>
                    <option value="NSE_INFY_5m.csv">🇮🇳 Infosys (5m)</option>
                    <option value="NSE_SBIN_5m.csv">🇮🇳 State Bank of India (5m)</option>
                    <option value="NSE_ICICIBANK_5m.csv">🇮🇳 ICICI Bank (5m)</option>
                    <option value="NSE_NIFTY50_1d.csv">🇮🇳 NIFTY 50 (1 Day Daily)</option>
                    <option value="NSE_RELIANCE_1d.csv">🇮🇳 Reliance Industries (1 Day Daily)</option>
                </select>
            </div>
            <div class="group">
                <label>Lookback (Context)</label>
                <input type="number" id="lookback" value="400" min="50" max="512">
            </div>
            <div class="group">
                <label>Prediction Horizon</label>
                <input type="number" id="predLen" value="120" min="10" max="256">
            </div>
            <button id="btn" onclick="run()">Generate Plot</button>
        </div>

        <div class="card">
            <div class="overlay" id="loading">Running Kronos Model...</div>
            <div id="chart"></div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Directional Hit Rate</div>
                    <div class="stat-val" id="hitRate" style="color:#22c55e;">--%</div>
                </div>
                <div class="stat-label-box stat">
                    <div class="stat-label">Mean Absolute Error (MAE)</div>
                    <div class="stat-val" id="mae">₹--</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Root Mean Squared Error (RMSE)</div>
                    <div class="stat-val" id="rmse">₹--</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', run);

        async function run() {
            const loading = document.getElementById('loading');
            const btn = document.getElementById('btn');
            loading.style.display = 'flex';
            btn.disabled = true;

            const filename = document.getElementById('datasetSelect').value;
            const lookback = parseInt(document.getElementById('lookback').value) || 400;
            const pred_len = parseInt(document.getElementById('predLen').value) || 120;

            try {
                const res = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, lookback, pred_len })
                });
                const data = await res.json();
                if (!data.success) {
                    alert("Error: " + data.error);
                    return;
                }

                // Plot
                const totalPoints = data.history.close.length + data.actual.close.length;
                const xAll = Array.from({length: totalPoints}, (_, i) => i);
                const xPred = Array.from({length: data.prediction.close.length}, (_, i) => data.history.close.length + i);

                const isCrypto = filename.includes('BTC') || filename.includes('ETH') || filename.includes('SOL');
                const priceLabel = isCrypto ? 'Close Price (USD)' : 'Close Price (INR)';

                const traceCloseGT = {
                    x: xAll,
                    y: data.history.close.concat(data.actual.close),
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Ground Truth',
                    line: { color: '#2563eb', width: 2 },
                    xaxis: 'x',
                    yaxis: 'y'
                };

                const traceClosePred = {
                    x: xPred,
                    y: data.prediction.close,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Prediction',
                    line: { color: '#ef4444', width: 2.2 },
                    xaxis: 'x',
                    yaxis: 'y'
                };

                const traceVolGT = {
                    x: xAll,
                    y: data.history.volume.concat(data.actual.volume),
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Ground Truth Volume',
                    line: { color: '#2563eb', width: 1.5 },
                    xaxis: 'x2',
                    yaxis: 'y2',
                    showlegend: false
                };

                const traceVolPred = {
                    x: xPred,
                    y: data.prediction.volume,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Prediction Volume',
                    line: { color: '#ef4444', width: 1.8 },
                    xaxis: 'x2',
                    yaxis: 'y2',
                    showlegend: false
                };

                const layout = {
                    grid: { rows: 2, columns: 1, pattern: 'independent' },
                    paper_bgcolor: '#1e293b',
                    plot_bgcolor: '#1e293b',
                    margin: { l: 70, r: 30, t: 20, b: 40 },
                    showlegend: true,
                    legend: { x: 0.02, y: 0.98, font: { color: '#f8fafc', size: 12 }, bgcolor: 'rgba(15,23,42,0.7)' },
                    hovermode: 'x unified',
                    xaxis: {
                        gridcolor: '#334155',
                        tickfont: { color: '#94a3b8' },
                        showticklabels: false,
                        matches: 'x2',
                        anchor: 'y'
                    },
                    yaxis: {
                        domain: [0.38, 1.0],
                        title: priceLabel,
                        titlefont: { color: '#f8fafc' },
                        gridcolor: '#334155',
                        tickfont: { color: '#94a3b8' },
                        autorange: true
                    },
                    xaxis2: {
                        gridcolor: '#334155',
                        tickfont: { color: '#94a3b8' },
                        title: 'Time Step (Index)',
                        titlefont: { color: '#94a3b8' },
                        matches: 'x',
                        anchor: 'y2'
                    },
                    yaxis2: {
                        domain: [0.0, 0.28],
                        title: 'Volume',
                        titlefont: { color: '#f8fafc' },
                        gridcolor: '#334155',
                        tickfont: { color: '#94a3b8' },
                        autorange: true
                    }
                };

                const config = {
                    responsive: true,
                    scrollZoom: true,
                    displayModeBar: true,
                    displaylogo: false,
                    modeBarButtonsToRemove: ['lasso2d', 'select2d']
                };

                Plotly.newPlot('chart', [traceCloseGT, traceClosePred, traceVolGT, traceVolPred], layout, config);

                // Stats
                document.getElementById('hitRate').textContent = data.stats.hit_rate + '%';
                document.getElementById('mae').textContent = '₹' + data.stats.mae;
                document.getElementById('rmse').textContent = '₹' + data.stats.rmse;

            } catch (e) {
                alert("Failed: " + e.message);
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
